  </defs>
  <circle cx="15.5" cy="25" r="9.2" fill="url(#g)"/>
  <circle cx="27.6" cy="15.6" r="6" fill="url(#g)"/>
  <circle cx="25.4" cy="6.4" r="3" fill="url(#g)"/>
