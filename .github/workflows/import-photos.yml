# One-time import of generated photos into images/gen/ (sources for img/).
name: Import generated photos
on:
  push:
    branches: [redesign/calm-recovery]
    paths: ['.github/workflows/import-photos.yml']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p images/gen
          get() { curl -fsSL --retry 3 "$1" -o "images/gen/$2"; }
          get https://d8j0ntlcm91z4.cloudfront.net/user_3C15E03naKYn0k12cqxNShlIybX/hf_20261007_091304_9dfc7684-bcb4-4461-84af-03ac765b2ad1.png g0.png
          get https://d8j0ntlcm91z4.cloudfront.net/user_3C15E03naKYn0k12cqxNShlIybX/hf_20261007_091305_67e20fcb-3759-4f89-8854-9ed4c89bbe13.png g1.png
          get https://d8j0ntlcm91z4.cloudfront.net/user_3C15E03naKYn0k12cqxNShlIybX/hf_20261007_091305_a13d1dd6-6419-453b-bf2c-ec85f088c493.png g2.png
          get https://d8j0ntlcm91z4.cloudfront.net/user_3C15E03naKYn0k12cqxNShlIybX/hf_20261007_091305_03b869f1-99e6-4dfd-aa83-d8b6f9fcbb83.png g3.png
          get https://d8j0ntlcm91z4.cloudfront.net/user_3C15E03naKYn0k12cqxNShlIybX/hf_20261007_091305_a88d542f-1761-4e38-ac53-f89d58b5d05a.png g4.png
          get https://d8j0ntlcm91z4.cloudfront.net/user_3C15E03naKYn0k12cqxNShlIybX/hf_20261007_091304_02ca1d41-13d7-4046-a76c-9f3e7d58f8c6.png g5.png
          get https://d8j0ntlcm91z4.cloudfront.net/user_3C15E03naKYn0k12cqxNShlIybX/hf_20261007_091304_f86583aa-29c8-4f19-9dc9-51853e40f505.png g6.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/gen
          git commit -m "Import generated photos (round 1)"
          git push
